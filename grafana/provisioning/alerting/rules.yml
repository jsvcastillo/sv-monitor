apiVersion: 1

groups:
  - orgId: 1
    name: infrastructure
    folder: Monitoring
    interval: 1m
    rules:
      - uid: prometheus-target-down
        title: Prometheus target down
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Target is down
          description: One or more Prometheus scrape targets are down.
        data:
          - refId: A
            datasourceUid: ffmkr6iqzev40c
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: up == 0
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: prometheus

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__